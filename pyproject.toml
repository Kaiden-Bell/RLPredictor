[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlpredictor"
version = "0.2.0"
description = "Explainable Rocket League esports match-outcome predictor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kaiden Bell" }]
dependencies = [
    "requests>=2.32",
    "mwparserfromhell>=0.6.6",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rlpredict = "rlpredictor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
